# SlideSLAM Bridge Configuration Parameters

# Coordinate frame settings
base_frame_suffix: "/base_link"
odom_frame_suffix: "/odom"
map_frame: "map"

# Topic remapping settings
airsim_topics:
  odom: "/airsim_node/odom_local_ned"
  lidar: "/airsim_node/lidar/Lidar"
  camera: "/airsim_node/camera_0/Scene"
  camera_info: "/airsim_node/camera_0/Scene/camera_info"

slideslam_topics:
  sync_odom: "/sync_odom"
  pointcloud: "/velodyne_points"
  observation: "/semantic_observation"
  slam_pose: "/sloam/optimized_odom"

coordination_topics:
  slam_pose_output: "/slam_pose"
  camera_output: "/camera/image_raw"
  camera_info_output: "/camera/camera_info"

# Processing settings
enable_camera_processing: true
enable_lidar_processing: true
publish_tf: true
debug_mode: false

# Timing settings
odom_publish_rate: 50.0  # Hz
lidar_publish_rate: 10.0  # Hz
camera_publish_rate: 5.0  # Hz